<head>
    <meta charset="UTF-8">

    <meta name="description" content="ドライフラワーや木の実を使った手作り雑貨を制作・販売する、富山の雑貨屋『nogoma』のホームページです。">
    <title>nogoma｜CONTACT</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru&display=swap" rel="stylesheet">

<body>

    <!-- =========================
HEADER
========================= -->

    <header class="site-header">

        <div class="header-inner">

            <!-- ロゴ -->
            <div class="logo-area">
                <a href="index.html" class="logo-link">

                    <!--
                ここに横長のPNGロゴを入れる
                例：image/logo.png
                -->
                    <!-- ロゴ -->

                    <div class="logo-area">


                        <a href="index.html" class="logo-link">

                            <picture>
                                <!-- スマホ：縦型ロゴ -->
                                <source media="(max-width: 768px)" srcset="svg/rogosikaku.svg">

                                <!-- PC：横型ロゴ -->
                                <img src="svg/rogoyoko.svg" alt="富山の小さな雑貨屋 nogoma" class="logo-image">
                            </picture>

                        </a>


                    </div>


                </a>
            </div>


            <!-- ナビゲーション -->
            <nav id="nav" class="main-nav" aria-label="メインナビゲーション">
            
                <ul>
            
                    <li>
                        <a href="index.html">
                            <img src="image/icons/home.png" alt="">
                            <span>HOME</span>
                        </a>
                    </li>
            
                    <li>
                        <a href="index.html#about">
                            <img src="image/icons/me.png" alt="">
                            <span>ABOUT</span>
                        </a>
                    </li>
            
                    <li>
                        <a href="index.html#news">
                            <img src="image/icons/right.png" alt="">
                            <span>NEWS</span>
                        </a>
                    </li>
            
                    <li>
                        <a href="goods.html">
                            <img src="image/icons/gift.png" alt="">
                            <span>GOODS</span>
                        </a>
                    </li>
            
                    <li>
                        <a href="blog.html">
                            <img src="image/icons/diary.png" alt="">
                            <span>BLOG</span>
                        </a>
                    </li>
            
                    <li>
                        <a href="index.html#shopinfo">
                            <img src="image/icons/ashi.png" alt="">
                            <span>ACCESS</span>
                        </a>
                    </li>
            
                    <li>
                        <a href="contact.html">
                            <img src="image/icons/mail.png" alt="">
                            <span>CONTACT</span>
                        </a>
                    </li>
            
                </ul>
            
            </nav>


            <!-- ハンバーガー -->
            <button class="hamburger" id="hamburger" type="button" aria-label="メニューを開く" aria-expanded="false"
                aria-controls="nav">
                <span></span>
                <span></span>
                <span></span>
            </button>

        </div>

    </header>


<!-- =========================
CONTACT
========================= -->

    <section class="contact-page">

        <h2 class="goods-title">

            <img src="image/icons/mail.png" class="bird-icon" alt="">

            <div class="title-center">
                CONTACT
            </div>

        </h2>

        <div class="contact-wrap">

            <div class="contact-text">

                <h3>お気軽にお問い合わせください</h3>

                <p>
                    商品についてのご質問や、
                    オーダーに関するご相談など、
                    お気軽にお問い合わせください。
                </p>

                <p>
                    内容を確認後、
                    2〜3営業日以内にご返信いたします。
                </p>

            </div>

            <form class="contact-form">

                <input type="text" name="name" placeholder="お名前" required>

                <input type="email" name="email" placeholder="メールアドレス" required>

                <input type="text" name="subject" placeholder="件名">

                <textarea name="message" rows="8" placeholder="お問い合わせ内容" required></textarea>

                <button type="submit">
                    送信する
                </button>

            </form>

        </div>

    </section>



<!-- =========================
TOPへ戻る
========================= -->

<a href="#top" class="top-btn">

    <img src="image/icons/backtotop.png" alt="トップへ戻る">

</a>
